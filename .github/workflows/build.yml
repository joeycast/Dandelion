name: Build

on:
  pull_request:
    branches:
      - develop
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Resolve iOS Simulator destination
        id: destination
        run: |
          # Xcode 26.3 GitHub runners ship iPhone 17 family simulators (not iPhone 16).
          # Prefer a concrete device when available; otherwise build for the simulator SDK.
          set +e
          SHOW=$(xcodebuild -project Dandelion.xcodeproj -scheme Dandelion -showdestinations 2>/dev/null)
          set -e

          DEST=$(printf '%s\n' "$SHOW" \
            | tr -d '\r' \
            | grep 'platform:iOS Simulator' \
            | grep 'name:iPhone 17' \
            | grep -v 'placeholder' \
            | grep 'arch:arm64' \
            | head -1 \
            | sed -E 's/.*id:([^,}]+).*/platform=iOS Simulator,id=\1/' || true)

          if [ -z "${DEST}" ]; then
            DEST=$(printf '%s\n' "$SHOW" \
              | tr -d '\r' \
              | grep 'platform:iOS Simulator' \
              | grep 'name:iPhone' \
              | grep -v 'placeholder' \
              | grep 'arch:arm64' \
              | head -1 \
              | sed -E 's/.*id:([^,}]+).*/platform=iOS Simulator,id=\1/' || true)
          fi

          if [ -z "${DEST}" ]; then
            echo "No concrete iPhone simulator found; using generic simulator destination"
            DEST='generic/platform=iOS Simulator'
          fi

          echo "Using destination: ${DEST}"
          echo "value=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild \
            -project Dandelion.xcodeproj \
            -scheme Dandelion \
            -configuration Debug \
            -destination "${{ steps.destination.outputs.value }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator app
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-build
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
          retention-days: 1
          if-no-files-found: warn
